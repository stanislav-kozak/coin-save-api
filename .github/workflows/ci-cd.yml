name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Redeploy the current main image, e.g. after changing settings in GitHub.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/stanislav-kozak/coin-save-api

jobs:
  # Tests run once, on the pull request. The merge to main then only builds
  # and deploys — branch protection on main (required `check`, branch up to
  # date) guarantees the merged code is exactly what was tested.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A new push to the PR cancels the now-outdated run.
    concurrency:
      group: check-${{ github.head_ref }}
      cancel-in-progress: true
    env:
      # prisma.config.ts reads DATABASE_URL at generate time; no DB is needed.
      DATABASE_URL: postgresql://user:password@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Deploy maps every .env.example key
        run: |
          missing=""
          for key in $(grep -oE '^[A-Z][A-Z0-9_]*=' .env.example | tr -d '='); do
            grep -qE "^ +$key: \\$\\{\\{ vars\\.$key \\|\\| secrets\\.$key \\}\\}" .github/workflows/ci-cd.yml \
              || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::Map these .env.example keys in the deploy job:$missing"
            exit 1
          fi
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0
      - name: Format
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - run: npm run typecheck
      - run: npm run test
      # Integration tests start their own Postgres via testcontainers.
      - run: npm run test:e2e
      - run: npm run build

  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    # Runs after a successful image build on push, or on its own when started
    # manually (docker is skipped then) — only ever from main.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.docker.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.docker.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: production
    # Never run two deploys at once; queue the newer one instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # Settings live in the `production` environment: Secrets for credentials,
      # Variables for plain config (either works for any key).
      # Every key of .env.example must be mapped here.
      - name: Render .env from GitHub settings
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL || secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ vars.JWT_ACCESS_SECRET || secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ vars.JWT_REFRESH_SECRET || secrets.JWT_REFRESH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ vars.GOOGLE_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ vars.RESEND_API_KEY || secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM || secrets.MAIL_FROM }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || secrets.FRONTEND_URL }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN || secrets.CORS_ORIGIN }}
          SENTRY_DSN_BACKEND: ${{ vars.SENTRY_DSN_BACKEND || secrets.SENTRY_DSN_BACKEND }}
          NODE_ENV: ${{ vars.NODE_ENV || secrets.NODE_ENV }}
        # Explicit `shell: bash` enables pipefail, and the script writes to a
        # file first, so a missing setting fails this step instead of
        # shipping an empty .env.
        shell: bash
        run: |
          scripts/ci/render-env.sh > "$RUNNER_TEMP/prod.env"
          test -s "$RUNNER_TEMP/prod.env"
          ENV_B64="$(base64 -w0 "$RUNNER_TEMP/prod.env")"
          rm "$RUNNER_TEMP/prod.env"
          echo "::add-mask::$ENV_B64"
          echo "ENV_B64=$ENV_B64" >> "$GITHUB_ENV"
      - uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.event_name == 'push' && github.sha || 'main' }}
          GHCR_USER: ${{ github.actor }}
          # Short-lived job token: lets the VPS pull the private image without
          # storing a long-lived registry credential there.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,ENV_B64
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            # Pull first so the newest deploy.sh is the one that runs.
            git pull --ff-only origin main
            # .env is managed from GitHub; keep the previous one for rollback.
            umask 077
            if [ -f .env ]; then cp .env .env.bak; fi
            printf '%s' "$ENV_B64" | base64 -d > .env.new
            # Never replace a working .env with an empty or broken one.
            if ! grep -q '^DATABASE_URL=' .env.new; then
              echo "Rendered .env is empty or incomplete; keeping the current one" >&2
              rm -f .env.new
              exit 1
            fi
            mv .env.new .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            ./deploy.sh api "$IMAGE_TAG" || { docker logout ghcr.io; exit 1; }
            docker logout ghcr.io
