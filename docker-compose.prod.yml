services:
  api:
    # CI pushes this image to GHCR and deploy.sh pulls it; `build` stays for
    # building locally with `npm run docker:prod:up`.
    image: ghcr.io/stanislav-kozak/coin-save-api:${API_IMAGE_TAG:-main}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"

  web:
    # Frontend (coin-save-app). Its own CI builds this image and deploys it
    # with `./deploy.sh web <sha>`; no env_file: it needs none of the API's
    # secrets (browser calls /api on the same origin via Caddy).
    image: ghcr.io/stanislav-kozak/coin-save-app:${WEB_IMAGE_TAG:-main}
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80" # HTTP: Let's Encrypt challenge + redirect to HTTPS
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      # Mount the directory, not the single file: `git pull` replaces
      # Caddyfile with a new file, and a single-file bind mount would keep
      # showing the container the old one, so `caddy reload` saw stale config.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
