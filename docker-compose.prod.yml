services:
  api:
    # CI pushes this image to GHCR and deploy.sh pulls it; `build` stays for
    # building locally with `npm run docker:prod:up`.
    image: ghcr.io/stanislav-kozak/coin-save-api:${API_IMAGE_TAG:-main}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"

  web:
    # Frontend (coin-save-app). Its own CI builds this image and deploys it
    # with `./deploy.sh web <sha>`; no env_file: it needs none of the API's
    # secrets (browser calls /api on the same origin via Caddy).
    image: ghcr.io/stanislav-kozak/coin-save-app:${WEB_IMAGE_TAG:-main}
    restart: unless-stopped
    expose:
      - "3000"

  # Postgres next to the API: ~1 ms per query instead of ~100 ms to a remote
  # database, and no cold starts. Not published to the host; data lives in
  # the pg-data volume. The API reaches it as DATABASE_URL=...@db:5432/coinsave.
  # POSTGRES_PASSWORD comes from .env (GitHub settings; the deploy refuses to
  # run without it). Not `:?` here: that would break every compose command,
  # e.g. a frontend deploy, until the backend deploy has written it.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coinsave
      POSTGRES_DB: coinsave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "coinsave", "-d", "coinsave"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Nightly pg_dump to the db-backups volume (7 kept) and, when BACKUP_S3_*
  # is set, off-site (e.g. Cloudflare R2). See DEPLOYMENT.md.
  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-entrypoint.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - ./scripts/db:/scripts:ro
      - db-backups:/backups
    depends_on:
      - db

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80" # HTTP: Let's Encrypt challenge + redirect to HTTPS
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      # Mount the directory, not the single file: `git pull` replaces
      # Caddyfile with a new file, and a single-file bind mount would keep
      # showing the container the old one, so `caddy reload` saw stale config.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
  pg-data:
  db-backups:
