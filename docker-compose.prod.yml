services:
  api:
    # CI pushes this image to GHCR and deploy.sh pulls it; `build` stays for
    # building locally with `npm run docker:prod:up`.
    image: ghcr.io/stanislav-kozak/coin-save-api:${API_IMAGE_TAG:-main}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80" # HTTP: Let's Encrypt challenge + redirect to HTTPS
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
